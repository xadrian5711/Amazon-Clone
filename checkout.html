 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
       <!-- NAV/SEARCHBAR   -->
    <nav class="flex items-center justify-between bg-[#001f3f] h-16 w-full px-4 shadow-md">  
    <div id="homeBtn" class="shrink-0">
      <a href="index.html" class="flex items-center text-white hover:outline-1 p-2">
        <img src="../Photos/Amazon-Logo-White-PNG.png" alt="Amazon Logo" class="h-15">
      </a>   
    </div>  
    
      
    <form class="flex-1 max-w-2xl mx-4">   
      <label for="default-search" class="sr-only">Search</label>
      <div class="relative">
          <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
              <svg class="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 20 20">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
              </svg>
          </div>
          <input type="search" id="default-search" class="block w-full py-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-xl bg-gray-50 outline-none" placeholder="Search Amazon..." required />
      </div>
    </form>

    <div id="cart-tool" class="shrink-0">
      <a href="checkout.html" class="flex items-center text-white hover:outline-1 p-2">
        <div class="relative flex items-center">
          <span id="nav-cart-count" class="absolute -top-2 left-3 bg-orange-500 text-black text-xs font-bold px-1.5 rounded-full">0</span>
          <img src="../Photos/shopping_cart_24dp_1F1F1F_FILL0_wght200_GRAD0_opsz24.png" alt="Cart Icon" class="h-8 w-8 bg-white">
        </div>
        <div class="ml-1 font-bold pt-2">
          Cart
        </div>
      </a>
    </div>    
  </nav>

 <!-- Shopping Cart Container -->

<div class="bg-gray-100 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
    
    <div class="flex-1 bg-white p-6 rounded-lg shadow-sm">
        
        <div class="flex justify-between items-end border-b border-gray-300 pb-4 mb-4">
            <h1 class="text-3xl font-normal text-gray-900">Shopping Cart</h1>
            <span class="text-sm text-gray-600 hidden sm:block">Price</span>
        </div>

        <div id="activeCart" class="flex flex-col gap-4">
            </div>

    </div>

    <div class="w-full lg:w-75 bg-white p-6 rounded-lg shadow-sm h-fit">
        <h2 class="text-xl font-bold text-gray-900 mb-4">Order Summary</h2>
        
        <div class="flex justify-between text-sm mb-2">
            <span>Items (<span id="checkout-item-count">0</span>):</span>
            <span id="checkout-subtotal">$0.00</span>
        </div>
        
        <div class="flex justify-between text-sm mb-2 pb-4 border-b border-gray-200">
            <span>Estimated Tax:</span>
            <span id="checkout-tax">$0.00</span>
        </div>
        
        <div class="flex justify-between text-lg font-bold text-red-700 mb-6 mt-4">
            <span>Order Total:</span>
            <span id="checkout-total">$0.00</span> </div>

        <button id="proceed-btn" class="w-full bg-yellow-400 hover:bg-yellow-500 rounded-full py-2 text-sm font-semibold transition-colors shadow-sm mt-4">
            Proceed to checkout
        </button>
    </div>

  </div>
</div>

<div id="checkout-modal" class="flex fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-8 max-w-sm w-full mx-4 shadow-xl text-center">
        <h2 class="text-2xl font-bold mb-2">Confirm Order</h2>
        <p class="text-gray-600 mb-6">Your card will be charged <span id="modal-total" class="font-bold text-gray-900 text-lg">$0.00</span>. Place order?</p>
        
        <div class="flex gap-4">
            <button id="close-modal-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 rounded-lg transition-colors">
                Cancel
            </button>
            <button id="confirm-order-btn" class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-semibold py-2 rounded-lg transition-colors">
                Confirm
            </button>
        </div>
    </div>
</div>

<script src="data/products.js"></script>
<script src="cart/cartLogic.js"></script>
<script src="pages/cartPage.js"></script>
</body>
</html>
